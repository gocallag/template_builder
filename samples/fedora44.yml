---
- name: FEDORA_44   # noqa: fqcn[keyword]
  hosts: "{{ run_on | default('localhost') }}"
  gather_facts: false
  become: false

  vars:
    id: fedora-44.0
    os:
      config:
        disks:
          - 50
        timezone: Australia/Melbourne

      iso: http://192.168.1.161:8180/fedora/Fedora-Server-dvd-x86_64-44-1.7.iso
      checksum: 85837793bfa36db6bc709b4cecd2ec116951b87d9c53c3d95eb2fac8dcf7cf1f
      console_boot: |
          <up>e<wait><down><down><end> inst.text inst.ks=http://{{ imagebuilder_httpip }}:{{ imagebuilder_localport }}/ks.cfg<leftCtrlOn>x<leftCtrlOff><enter>

  collections:
    - gocallag.template_builder
  roles:
    - imagebuilder
    - target_proxmox
