---
- name: OL-8.10 Build
  hosts: "{{ run_on | default('localhost') }}"
  gather_facts: false
  become: false

  vars:
    imagebuilder_targets:
      - plugin: gocallag.imagebuilder_target.proxmox
      # - plugin: gocallag.imagebuilder_target.vsphere

    id: ol-8.10

    os:
      plugin: gocallag.imagebuilder_os.oraclelinux
      family: linux
      distribution: oracle
      version: "8.10"
      architecture: x86_64

      config:
        disks:
          - 40
        timezone: Australia/Melbourne

      iso: http://192.168.1.161:8180/Oracle/OL-8/OracleLinux-R8-U10-x86_64-dvd.iso
      checksum: 7676a80eeaafa16903eebb2abba147a3afe230b130cc066d56fdd6854d8da900
      console_boot: |
          <up><wait><tab><wait> inst.text inst.ks=http://{{ imagebuilder_httpip }}:{{ imagebuilder_localport }}/ks.cfg<enter>

  roles:
    - gocallag.template_builder.imagebuilder
