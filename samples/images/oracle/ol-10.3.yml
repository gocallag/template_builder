---
- name: OL-10.3 Build
  hosts: "{{ run_on | default('localhost') }}"
  gather_facts: false
  become: false
  vars:
    imagebuilder_targets:
      - plugin: gocallag.imagebuilder_target.proxmox
      # - plugin: gocallag.imagebuilder_target.vsphere

    id: ol-10.3

    os:
      plugin: gocallag.imagebuilder_os.oraclelinux
      family: linux
      distribution: oracle
      version: "10.3"
      architecture: x86_64

      config:
        disks:
          - 40
        timezone: Australia/Melbourne

      iso: https://yum.oracle.com/ISOS/OracleLinux/OL10/u3/x86_64/OracleLinux-R10-U3-x86_64-dvd.iso

      checksum: 0f2c871bb0499c1ebd051a1111064c727bda58d1116418c475ecc5b4f8257ab3

      console_boot: |
        <up>e<down><down><end> inst.text inst.ks=http://{{ imagebuilder_httpip }}:{{ imagebuilder_localport }}/ks.cfg<leftCtrlOn>x<leftCtrlOff>

  roles:
    - gocallag.template_builder.imagebuilder
