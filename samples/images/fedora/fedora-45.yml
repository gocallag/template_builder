---
- name: FEDORA-45 Build
  hosts: "{{ run_on | default('localhost') }}"
  gather_facts: false
  become: false


  vars:
    imagebuilder_targets:
      - plugin: gocallag.imagebuilder_target.proxmox
      # - plugin: gocallag.imagebuilder_target.vsphere

    id: fedora-45
    build:
       ansible_python_interpreter: /usr/bin/python3.14
    os:
      plugin: gocallag.imagebuilder_os.fedora
      family: linux
      distribution: fedora
      version: "45"
      architecture: x86_64
      config:
        disks:
          - 40
        timezone: Australia/Melbourne

      iso: http://192.168.1.161:8180/fedora/Fedora-Server-dvd-x86_64-45-1.4.iso
      checksum: fcc0f623708ddbd7656df152510ba018bad618bfc99879e73809255fb11a48ff
      console_boot: |
          <up>e<wait><down><down><end> inst.text inst.ks=http://{{ imagebuilder_httpip }}:{{ imagebuilder_localport }}/ks.cfg<leftCtrlOn>x<leftCtrlOff><enter>
    ks: |
      cdrom
      text
      eula --agreed
      lang en_US.UTF-8
      keyboard us
      rootpw {{ imagebuilder_config.credentials.linux_admin.password }}
      selinux --enforcing
      firstboot --disable
      firewall --enabled --ssh --port=22/tcp
      authselect --enableshadow --passalgo=sha512
      skipx
      poweroff
      services --disabled="kdump" --enabled="auditd,chronyd,rsyslog,sshd"
      timezone {{ os.config.timezone }} --utc
      network --hostname={{ imagebuilder_id_base }} --bootproto=dhcp --activate --onboot=on --noipv6
      clearpart --all --disklabel gpt --drives=sda
      bootloader --location mbr
      ignoredisk --only-use=sda
      part biosboot --fstype=biosboot --size=1 --ondisk=sda
      partition /boot/efi --fstype=efi --label EFI  --size=200 --ondisk=sda
      part /boot --size=1024 --ondisk sda --fstype xfs
      part pv.1 --size 1 --grow --asprimary --ondisk sda
      volgroup fedora pv.1
      logvol / --fstype xfs --name lvroot --vgname fedora --size 1024
      logvol /home --fstype xfs --name lvhome --vgname fedora --size 512
      logvol /opt --fstype xfs --name lvopt --vgname fedora --size 512
      logvol /tmp --fstype xfs --name lvtmp --vgname fedora --size 512
      logvol /usr --fstype xfs --name lvusr --vgname fedora --size 4096
      logvol /var --fstype xfs --name lvvar --vgname fedora --size 3172
      logvol /var/log --fstype xfs --name=lvvarlog --vgname fedora --size 1024
      logvol /var/log/audit --fstype xfs --name lvvarlogaud --vgname fedora --size 512
      logvol swap --fstype swap --recommended --name swap --vgname fedora

      user --name={{ imagebuilder_config.credentials.ansible.username }} --groups=wheel --plaintext --password={{ imagebuilder_config.credentials.ansible.password }}

      %packages --ignoremissing --excludedocs --inst-langs=en_US.utf8
        # Fedora-specific packages
        # Fedora 43 and later
        @Base
        rsyslog
        cloud-init
        cloud-utils-growpart
        audit
        bzip2
        chrony
        deltarpm
        dnf-utils
        net-tools
        wget
        cloud-init
        cloud-utils-growpart
        rsync
        tar
        patch
        vim
        yum-utils
        # Remove ALSA firmware
        -a*-firmware
        # Remove Intel wireless firmware
        -i*-firmware
        -open-vm-tools
        -qemu-guest-agent

      %end
      # disable kdump service
      %addon com_redhat_kdump --disable
      %end

      %post
        # Disable unused filesystems
        echo "install cramfs /bin/true" > /etc/modprobe.d/cramfs.conf
        echo "install freevxfs /bin/true" > /etc/modprobe.d/freevxfs.conf
        echo "install jffs2 /bin/true" > /etc/modprobe.d/jffs2.conf
        # Set Python alternatives
        dnf install -y python3.14
        alternatives --set python $(command -v python3)

        #---- Install our SSH key ----
        id -u {{ imagebuilder_config.credentials.ansible.username }} &>/dev/null || useradd -m -s /bin/bash {{ imagebuilder_config.credentials.ansible.username }}
        mkdir -m0700 /home/{{ imagebuilder_config.credentials.ansible.username }}/.ssh/
        echo "{{ imagebuilder_config.credentials.ansible.public_key }}" > /home/{{ imagebuilder_config.credentials.ansible.username }}/.ssh/authorized_keys
        chown -R {{ imagebuilder_config.credentials.ansible.username }}:wheel /home/{{ imagebuilder_config.credentials.ansible.username }}/.ssh
        chmod 0600 /home/{{ imagebuilder_config.credentials.ansible.username }}/.ssh/authorized_keys
        # Ensure ansible user is in the wheel group
        usermod -aG wheel {{ imagebuilder_config.credentials.ansible.username }}
        echo "{{ imagebuilder_config.credentials.ansible.username }} ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/ansible
        chmod 0440 /etc/sudoers.d/ansible

        # Check if SELinux is enabled before running restorecon to avoid unnecessary errors
        if [ "$(getenforce)" != "Disabled" ]; then
          restorecon -R /home/{{ imagebuilder_config.credentials.ansible.username }}/.ssh/
        fi

        # Configure password quality settings
        sed -i '/^minlen/d' /etc/security/pwquality.conf
        echo "minlen = 14" >> /etc/security/pwquality.conf
        sed -i '/^dcredit/d' /etc/security/pwquality.conf
        sed -i '/^ucredit/d' /etc/security/pwquality.conf
        sed -i '/^ocredit/d' /etc/security/pwquality.conf
        sed -i '/^lcredit/d' /etc/security/pwquality.conf
        echo "dcredit = -1" >> /etc/security/pwquality.conf
        echo "ucredit = -1" >> /etc/security/pwquality.conf
        echo "ocredit = -1" >> /etc/security/pwquality.conf
        echo "lcredit = -1" >> /etc/security/pwquality.conf
      %end
  roles:
    - gocallag.template_builder.imagebuilder
