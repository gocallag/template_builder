---
- name: ALMA-10.3 Build
  hosts: "{{ run_on | default('localhost') }}"
  gather_facts: false
  become: false

  vars:
    imagebuilder_targets:
      - plugin: gocallag.imagebuilder_target.proxmox
      # - plugin: gocallag.imagebuilder_target.vsphere

    id: alma-10.3
    os:
      plugin: gocallag.imagebuilder_os.almalinux
      family: linux
      distribution: almalinux
      version: "10.3"
      architecture: x86_64
      config:
        disks:
          - 40
        timezone: Australia/Melbourne
      iso: https://mirror.aarnet.edu.au/pub/almalinux/10.3/isos/x86_64/AlmaLinux-10.3-x86_64-dvd.iso
      checksum: f74ae9c4a8e7e3e70147534856ea276f71649d16c70b7d3ec80d0905a7b93982
      console_boot: |
        <up>e<down><down><end> inst.text inst.ks=http://{{ imagebuilder_httpip }}:{{ imagebuilder_localport }}/ks.cfg<leftCtrlOn>x<leftCtrlOff>

  roles:
    - gocallag.template_builder.imagebuilder
