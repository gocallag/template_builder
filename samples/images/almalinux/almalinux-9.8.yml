---
- name: ALMA-9.8 Build
  hosts: "{{ run_on | default('localhost') }}"
  gather_facts: false
  become: false

  vars:
    imagebuilder_targets:
      - plugin: gocallag.imagebuilder_target.proxmox
      # - plugin: gocallag.imagebuilder_target.vsphere

    id: alma-9.8
    os:
      plugin: gocallag.imagebuilder_os.almalinux
      family: linux
      distribution: almalinux
      version: "9.8"
      architecture: x86_64
      config:
        disks:
          - 40
        timezone: Australia/Melbourne
      iso: http://192.168.1.161:8180/almalinux/9/AlmaLinux-9.8-x86_64-dvd.iso
      checksum: 7a392bdc879afd159b30da39a356b7b26c1ddf618b01549164da9aadbc40d814
      console_boot: |
        <up><wait><tab><wait> inst.text inst.ks=http://{{ imagebuilder_httpip }}:{{ imagebuilder_localport }}/ks.cfg<enter>
        
  roles:
    - gocallag.template_builder.imagebuilder
