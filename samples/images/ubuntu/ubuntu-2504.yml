---
- name: UBUNTU-2504 Build
  hosts: "{{ run_on | default('localhost') }}"
  gather_facts: false
  become: false

  vars:
    imagebuilder_targets:
      - plugin: gocallag.imagebuilder_target.proxmox
      # - plugin: gocallag.imagebuilder_target.vsphere

    id: ubuntu-25.04

    os:
      plugin: gocallag.imagebuilder_os.ubuntu
      family: linux
      distribution: ubuntu
      version: "25.04"
      architecture: x86_64

      config:
        disks:
          - 40
        timezone: Australia/Melbourne

      iso: http://192.168.1.161:8180/canonical/Ubuntu-2504/ubuntu-25.04-live-server-amd64.iso
      checksum: 8b44046211118639c673335a80359f4b3f0d9e52c33fe61c59072b1b61bdecc5
      console_boot: |
          e<down><down><down><end><backspace><backspace><backspace><backspace> autoinstall<leftCtrlOn>x<leftCtrlOff>

  roles:
    - gocallag.template_builder.imagebuilder
