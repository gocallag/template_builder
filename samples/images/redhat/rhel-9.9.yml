---
- name: RHEL-9.9 Build
  hosts: "{{ run_on | default('localhost') }}"
  gather_facts: false
  become: false

  vars:
    imagebuilder_targets:
      - plugin: gocallag.imagebuilder_target.proxmox
      # - plugin: gocallag.imagebuilder_target.vsphere
    id: rhel-9.9

    os:
      plugin: gocallag.imagebuilder_os.rhel
      family: linux
      distribution: rhel
      version: "9.9"
      architecture: x86_64

      config:
        disks:
          - 40
        timezone: Australia/Melbourne

      iso: http://192.168.1.161:8180/redhat/RHEL9/rhel-9.9-x86_64-dvd.iso
      checksum: 9833bfb1888a307228cc2487912c0529d5253ffe96c79ef1a5219011e4ab067e
      console_boot: |
        <up><wait><tab><wait> inst.text inst.ks=http://{{ imagebuilder_httpip }}:{{ imagebuilder_localport }}/ks.cfg<enter>

  roles:
    - gocallag.template_builder.imagebuilder
