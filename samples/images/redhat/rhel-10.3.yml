---
- name: RHEL-10.3 Build
  hosts: "{{ run_on | default('localhost') }}"
  gather_facts: false
  become: false

  vars:
    imagebuilder_targets:
      - plugin: gocallag.imagebuilder_target.proxmox
      # - plugin: gocallag.imagebuilder_target.vsphere

    id: rhel-10.3

    os:
      plugin: gocallag.imagebuilder_os.rhel
      family: linux
      distribution: rhel
      version: "10.3"
      architecture: x86_64

      config:
        disks:
          - 40
        timezone: Australia/Melbourne

      iso: http://192.168.1.161:8180/redhat/RHEL10/rhel-10.3-x86_64-dvd.iso
      checksum: e75131f850de8baef88d3822c63abe1f66434992be168afed30506906a69ceff
      console_boot: |
        <up>e<down><down><end> inst.text inst.ks=http://{{ imagebuilder_httpip }}:{{ imagebuilder_localport }}/ks.cfg<leftCtrlOn>x<leftCtrlOff>

  roles:
    - gocallag.template_builder.imagebuilder
