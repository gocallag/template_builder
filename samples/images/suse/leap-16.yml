---
- name: Leap-16 | Build a Leap-16 image
  hosts: "{{ run_on | default('localhost') }}"
  gather_facts: false
  become: false


  vars:
    imagebuilder_targets:
      - plugin: gocallag.imagebuilder_target.proxmox
      # - plugin: gocallag.imagebuilder_target.vsphere
    id: leap-16

    os:
      plugin: gocallag.imagebuilder_os.suse
      family: linux
      distribution: leap
      version: "16"
      architecture: x86_64

      config:
        disks:
          - 40
        timezone: Australia/Melbourne

      iso: http://192.168.1.161:8180/suse/Leap-16.0-offline-installer-x86_64.install.iso
      checksum: d780a228058fb4688a31b5bde22d7b97c86e04a2ced33f3d7c8e88a710d96d24
      console_boot: |
            <down>e<down><down><down><down><end> ifcfg=enp0s3 netsetup=dhcp inst.auto=http://{{ imagebuilder_httpip }}:{{ imagebuilder_localport }}/profile.jsonnet inst.finish=poweroff <leftCtrlOn>x<leftCtrlOff>

  roles:
    - gocallag.template_builder.imagebuilder
