- name: Buildbase | Set Template
  block:
    # - name: Buildbase |Set QEMU arguments
    #   ansible.builtin.set_fact:
    #     qemu_args: # noqa: var-naming
    #       - "-name {{ imagebuilder_id_base }}"
    #       - "-enable-kvm"
    #       - "-cpu host"
    #       - "-smp {{ imagebuilder_build_vcpus }}"
    #       - "-m {{ imagebuilder_build_ram }}"
    #       - "-netdev user,id=net0,hostfwd=tcp:0.0.0.0:{{ (os_type | lower == 'linux') | ternary(imagebuilder_env_qemu_ssh_port, imagebuilder_env_qemu_psrp_port) }}-:{{ (os_type | lower == 'windows') | ternary(5986, 22) }}"
    #       - "-device {{ os.config.nicdriver | default('e1000') }},netdev=net0"
    #       - "-device ich9-ahci,id=ahci"
    #       - "-drive file={{ imagebuilder_path_imagedir }}/{{ imagebuilder_id_base }}.x86_64.qcow2,media=disk,if=none,format=qcow2,id=disk0"
    #       - "-device ide-hd,drive=disk0,bus=ahci.0"
    #       - "-vnc 0.0.0.0:{{ imagebuilder_port_offset }}"


    # - name: Buildbase | Set QEMU command
    #   ansible.builtin.set_fact:
    #     imagebuilder_qemu_command: "{{ imagebuilder_base_qemu_command }} {{ qemu_args | join(' ') }}"

    - name: Buildbase | Set QEMU command with aux ISO if needed
      ansible.builtin.set_fact:
        imagebuilder_qemu_command: "{{ imagebuilder_qemu_command }} -drive file={{ imagebuilder_path_httpdir }}/aux.iso,media=cdrom,if=ide,index=2"
      when: os.useauxiso | default(false) | bool

    - name: Buildbase | Set installer launch command
      ansible.builtin.set_fact:
        imagebuilder_qemu_install_launch_command: >-
          {{ imagebuilder_qemu_command }}
          -chardev socket,id=mon0,host=localhost,port={{ imagebuilder_env_qemu_monport }},server=on,wait=off
          -mon chardev=mon0
          -boot order=d
          -drive file={{ imagebuilder_build_iso }},media=cdrom,if=ide,index=1

    - name: Buildbase | Start temporary web server
      ansible.builtin.shell: |
        python3 -m http.server {{ imagebuilder_localport }} --directory {{ imagebuilder_path_httpdir }}
      async: 3600        # max runtime in seconds
      poll: 0            # run in background
      register: webserver # noqa: var-naming
      changed_when: true
    - name: Buildbase | Build base
      when:
        - not imagebuilder_restored_from_image | default(false) | bool
      block:
        - name: Buildbase | Show QEMU command
          ansible.builtin.debug:
            msg: "{{ imagebuilder_qemu_install_launch_command }}"
        - name: Buildbase | Launch QEMU VM
          ansible.builtin.include_tasks:
            file: qemu/launch.yml
          vars:
            imagebuilder_qemu_launch_command: "{{ imagebuilder_qemu_install_launch_command }}"

        - name: "Buildbase | Wait for QEMU monitor"
          ansible.builtin.include_tasks:
            file: qemu/wait_monitor.yml
          vars:
            imagebuilder_qemu_monitor_delay: 5
        - name: "Buildbase | Show console boot commands"
          ansible.builtin.debug: msg="{{ os.console_boot | map('string') | join('') }}" # noqa: no-free-form
          when:
            - os.console_boot is defined
        - name: "Buildbase | Run sendkeys script to send commands to QEMU monitor"
          vars:
            sendkeys_script: "{{ imagebuilder_path_basedir }}/sendkeys.py"
            sendkeys_commands: "{{ os.console_boot }}"
          ansible.builtin.command:
            argv:
              - python3
              - "{{ imagebuilder_path_basedir }}/sendkeys.py"
              - --host
              - localhost
              - --port
              - "{{ imagebuilder_env_qemu_monport }}"
              - --boot-command
              - "{{ os.console_boot }}"
          delegate_to: "{{ run_on | default('localhost') }}"
          changed_when: true
          register: sendkeys_result # noqa: var-naming
          when:
            - os.console_boot is defined
        - name: "Buildbase | Show sendkeys result"
          ansible.builtin.debug:
            msg: "{{ sendkeys_result }}"
          when:
            - os.console_boot is defined

        - name: "Buildbase | Wait for QEMU monitor after installer input"
          ansible.builtin.include_tasks:
            file: qemu/wait_monitor.yml
          vars:
            imagebuilder_qemu_monitor_delay: 20

        - name: "Buildbase | Wait for QEMU async job to finish"
          ansible.builtin.include_tasks:
            file: qemu/wait_job.yml
          vars:
            imagebuilder_qemu_job_retries: 45
            imagebuilder_qemu_job_delay: 60
            imagebuilder_qemu_delegate: "{{ run_on | default('localhost') }}"

        - name: "Buildbase | save base image"
          block:
            - name: "Buildbase | Wait for base image release"
              ansible.builtin.include_tasks:
                file: qemu/wait_image_release.yml
              vars:
                imagebuilder_qemu_image_path: "{{ imagebuilder_path_imagedir }}/{{ imagebuilder_id_base }}.x86_64.qcow2"

            # Flush host page cache before conversion
            - name: Sync host filesystem
              ansible.builtin.command: "sync"
              changed_when: false

            - name: "Buildbase | convert base image with free block cleanup"
              ansible.builtin.command: qemu-img convert -f qcow2 -O qcow2 "{{ imagebuilder_path_imagedir }}/{{ imagebuilder_id_base }}.x86_64.qcow2" "{{ imagebuilder_path_savedir }}/{{ imagebuilder_id_base }}.base.{{ imagebuilder_profile_hash }}.qcow2.tmp"
              changed_when: true

            - name: "Buildbase | finalize base image"
              ansible.builtin.command: mv "{{ imagebuilder_path_savedir }}/{{ imagebuilder_id_base }}.base.{{ imagebuilder_profile_hash }}.qcow2.tmp" "{{ imagebuilder_path_savedir }}/{{ imagebuilder_id_base }}.base.{{ imagebuilder_profile_hash }}.qcow2"
              changed_when: true

            - name: "Buildbase | write base artifact metadata"
              ansible.builtin.copy:
                dest: "{{ imagebuilder_path_savedir }}/{{ imagebuilder_id_base }}.base.{{ imagebuilder_profile_hash }}.qcow2.meta.yml"
                mode: '0644'
                content: |
                  profile_hash: "{{ imagebuilder_profile_hash }}"
                  id: "{{ imagebuilder_id_base }}"
                  created_at: "{{ ansible_date_time.iso8601 }}"
                  stage: base


  rescue:
    - name: "Buildbase | Show error on failure"
      ansible.builtin.debug:
        msg: >-
          (QEMU) Task '{{ ansible_failed_task }}' failed.
          {{ ansible_failed_result.msg | default('no additional message') }}
      tags:
        - always
  always:
    - name: "Buildbase | Cleanup temporary webserver + dangling QEMU"
      ansible.builtin.include_tasks:
        file: qemu/cleanup_process.yml
      vars:
        imagebuilder_qemu_cleanup_webserver: true
