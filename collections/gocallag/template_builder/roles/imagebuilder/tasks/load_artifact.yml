---
- name: Load Artifact | Define phase root
  ansible.builtin.set_fact:
    imagebuilder_artifact_phase_root: >-
      {{
        imagebuilder_path_librarydir
      }}/{{ imagebuilder_profile_hash }}/{{ imagebuilder_artifact_phase }}
- name: Load Artifact | Discover generations
  ansible.builtin.find:
    paths: "{{ imagebuilder_artifact_phase_root }}"
    recurse: false
    file_type: directory
  register: imagebuilder_artifact_generations
  failed_when: false
- name: Load Artifact | Determine latest generation
  ansible.builtin.set_fact:
    imagebuilder_artifact_generation: >-
      {{
        (
          imagebuilder_artifact_generations.files
          | map(attribute='path')
          | map('basename')
          | select('match', '^[0-9]{4}$')
          | list
          | sort
          | last
        )
        if imagebuilder_artifact_generations.matched | default(0) > 0
        else none
      }}
- name: Load Artifact | Define paths
  ansible.builtin.set_fact:
    imagebuilder_artifact_generation_root: >-
      {{
        imagebuilder_artifact_phase_root
      }}/{{ imagebuilder_artifact_generation }}
  when:
    - imagebuilder_artifact_generation is not none
- name: Load Artifact | Load metadata
  ansible.builtin.slurp:
    src: "{{ imagebuilder_artifact_generation_root }}/metadata.yml"
  register: imagebuilder_artifact_metadata_raw
  when:
    - imagebuilder_artifact_generation is not none
- name: Load Artifact | Decode metadata
  ansible.builtin.set_fact:
    imagebuilder_loaded_artifact:
      phase: "{{ imagebuilder_artifact_phase }}"
      generation: "{{ imagebuilder_artifact_generation }}"
      path: "{{ imagebuilder_artifact_generation_root }}/image.qcow2"
      metadata_path: "{{ imagebuilder_artifact_generation_root }}/metadata.yml"
      metadata: >-
        {{
          imagebuilder_artifact_metadata_raw.content
          | b64decode
          | from_yaml
        }}
  when:
    - imagebuilder_artifact_generation is not none
- name: Load Artifact | Return empty result
  ansible.builtin.set_fact:
    imagebuilder_loaded_artifact:
      phase: "{{ imagebuilder_artifact_phase }}"
      generation: null
      path: null
      metadata: {}
  when:
    - imagebuilder_artifact_generation is none