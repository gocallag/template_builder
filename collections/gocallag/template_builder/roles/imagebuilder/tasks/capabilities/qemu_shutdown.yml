---
- name: (CAP-QEMU) Validate shutdown inputs
  ansible.builtin.assert:
    that:
      - imagebuilder_capability_artifact is defined
      - imagebuilder_capability_artifact.path is defined
      - imagebuilder_cap_qemu_job is defined
      - imagebuilder_cap_qemu_job.ansible_job_id is defined
    fail_msg: "(CAP-QEMU) Invalid shutdown capability state"

- name: (CAP-QEMU) Shutdown Linux guest
  when:
    - os_type | lower == "linux"
  block:
    - name: (CAP-QEMU) Request guest shutdown
      ansible.builtin.shell: "shutdown -h -t now && sleep 120"
      become: true
      changed_when: true
      delegate_to: bob_build
      register: imagebuilder_shutdown_request
      failed_when: false
      ignore_unreachable: true

  rescue:
    - name: (CAP-QEMU) Guest already shut down or unreachable
      ansible.builtin.debug:
        msg: "(CAP-QEMU) Guest is already shut down or unreachable; continuing without failure."
      changed_when: false

- name: (CAP-QEMU) Shutdown Windows guest
  when:
    - os_type | lower == "windows"
  block:
    - name: (CAP-QEMU) Request guest shutdown
      ansible.windows.win_shell: shutdown /s /t 0
      become: true
      become_user: SYSTEM
      become_method: ansible.builtin.runas
      delegate_to: bob_build
      register: imagebuilder_shutdown_request
      failed_when: false

  rescue:
    - name: (CAP-QEMU) Guest already shut down or unreachable
      ansible.builtin.debug:
        msg: "(CAP-QEMU) Guest is already shut down or unreachable; continuing without failure."
      changed_when: false

- name: (CAP-QEMU) Wait for QEMU job
  ansible.builtin.include_tasks:
    file: qemu/wait_job.yml
  vars:
    imagebuilder_qemu_job: "{{ imagebuilder_cap_qemu_job }}"
    imagebuilder_qemu_job_fail_on_error: false

- name: (CAP-QEMU) Wait for image release
  ansible.builtin.include_tasks:
    file: qemu/wait_image_release.yml
  vars:
    imagebuilder_qemu_image_path: "{{ imagebuilder_capability_artifact.path }}"
