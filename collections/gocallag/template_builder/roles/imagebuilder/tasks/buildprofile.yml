---
# - name: (BUILDPROFILE) include variant-specific tasks
#   ansible.builtin.include_tasks:
#     file: buildprofile/{{ os_variant | lower }}.yml
#   when: os_variant is defined
- name: (BUILDPROFILE) Build OS-specific profile
  ansible.builtin.include_role:
    name: "{{ os.plugin }}"
    tasks_from: buildprofile
  vars:
    imagebuilder_os: "{{ os }}"
- name: (BUILDPROFILE) Display build hash
  ansible.builtin.debug:
    msg: "Build profile hash: {{ imagebuilder_profile_hash }}"
