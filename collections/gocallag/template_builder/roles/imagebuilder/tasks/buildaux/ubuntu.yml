---
# Ubuntu-Based Systems
- name: (BUILDAUX, ubuntu)
  tags:
      - build_aux
  block:
      - name: (BUILDAUX, ubuntu) create build directories
        ansible.builtin.file:
            path: "{{ file }}"
            state: directory
            mode: "0755"
        loop_control:
            loop_var: file
        loop:
            - "{{ imagebuilder_build_basedir }}/build"
            - "{{ imagebuilder_build_basedir }}/build/mnt"


      - name: (BUILDAUX, ubuntu) remove existing aux ISO (if it exists)
        ansible.builtin.file:
            path: "{{ imagebuilder_build_basedir }}/build/aux.iso"
            state: absent

      - name: (BUILDAUX, ubuntu) create temporary iso contents dir
        ansible.builtin.file:
            path: "{{ imagebuilder_build_basedir }}/build/iso_contents"
            mode: "0755"
            state: directory
      - name: (BUILDAUX, ubuntu) use default ks if none provided
        ansible.builtin.include_tasks:
            file: buildprofile/ubuntu.yml

      - name: (BUILDAUX, ubuntu) Copy meta-data to ISO contents
        ansible.builtin.copy:
            content: "{{ metadata }}"
            dest: "{{ imagebuilder_build_basedir }}/build/iso_contents/meta-data"
            mode: "0644"
        become: true

      - name: (BUILDAUX, ubuntu) Copy user-data to ISO contents
        ansible.builtin.copy:
            content: "{{ build_profile.os_userdata }}"
            dest: "{{ imagebuilder_build_basedir }}/build/iso_contents/user-data"
            mode: "0644"
        become: true

      - name: (BUILDAUX, ubuntu) Build aux ISO from contents (label CIDATA)
        ansible.builtin.command: >
          genisoimage -output aux.iso -volid CIDATA -joliet -rock meta-data user-data
        args:
            chdir: "{{ imagebuilder_build_basedir }}/build/iso_contents"
            creates: "{{ imagebuilder_build_basedir }}/build/aux.iso"
        register: mkiso # noqa: var-naming
        failed_when: mkiso.rc != 0

      - name: (BUILDAUX, ubuntu) Move aux ISO to build directory
        ansible.builtin.command: >
          mv {{ imagebuilder_build_basedir }}/build/iso_contents/aux.iso {{ imagebuilder_build_basedir }}/build/aux.iso
        args:
            creates: "{{ imagebuilder_build_basedir }}/build/aux.iso"

      # - name: (BUILDAUX, ubuntu) Remove temporary ISO contents directory
      #   ansible.builtin.file:
      #       path: "{{ imagebuilder_build_basedir }}/build/iso_contents"
      #       state: absent
      #   become: true
