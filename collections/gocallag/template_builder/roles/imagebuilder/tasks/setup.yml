- name: Setup | Initial setup and variable validation
  tags:
      - always
  block:
      - name: Setup | Add new system to in-memory inventory
        ansible.builtin.add_host:
            name: 'bob_build'
            ansible_host: "{{ imagebuilder_localip }}"
            ansible_user: "{{ imagebuilder_config.credentials.ansible.username }}"
            ansible_password: "{{ imagebuilder_config.credentials.ansible.password }}"
            ansible_port: "{{ (os_type | lower == 'linux') | ternary(imagebuilder_env_qemu_ssh_port, imagebuilder_env_qemu_psrp_port) }}"
            ansible_connection: "{{ (os_type | lower == 'linux') | ternary('ssh', 'psrp') }}"
            ansible_psrp_auth: "negotiate"
            ansible_psrp_cert_validation: ignore
            ansible_psrp_operation_timeout: 120
            ansible_psrp_connection_timeout: 180
            ansible_psrp_read_timeout: 1800
            ansible_psrp_reconnection_retries: 3
            ansible_psrp_reconnection_backoff: 5

    #   - name: (SETUP) get current user info
    #     ansible.builtin.command: whoami
    #     register: imagebuilder_current_user
    #     changed_when: false

      - name: Setup | Create build directories
        ansible.builtin.file:
            path: "{{ file }}"
            state: directory
            mode: "0755"
            owner: "{{ ansible_user_id }}"
        become: true
        loop_control:
            loop_var: file
        loop: "{{ imagebuilder_required_directories }}"

      - name: Setup | Copy qemu monitor script
        ansible.builtin.template:
            src: "files/qemu/sendkeys.py"
            dest: "{{ imagebuilder_path_basedir }}/sendkeys.py"
            mode: '0755'
        delegate_to: "{{ run_on | default('localhost') }}"

      - name: Setup | Cleanup temporary webserver and dangling QEMU
        ansible.builtin.include_tasks:
            file: qemu/cleanup_process.yml
        vars:
            imagebuilder_qemu_cleanup_webserver: true
