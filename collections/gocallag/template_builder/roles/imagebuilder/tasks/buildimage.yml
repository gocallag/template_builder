---
- name: Buildimage | Include build implementation
  block:
    - name: Buildimage | Perform the base build
      when: imagebuilder_phase in ['base','build']
      ansible.builtin.include_tasks: buildbase.yml


    - name: "Buildimage | Power on QEMU VM (customise)"
      when: imagebuilder_phase in ['build','patch']
      block:
        - name: "Buildimage | Power on QEMU VM (customise)"
          ansible.builtin.include_tasks:
            file: qemu/launch.yml
          vars:
            imagebuilder_qemu_launch_command: >-
              {{ imagebuilder_qemu_command }}
              -chardev socket,id=mon0,host=localhost,port={{ imagebuilder_env_qemu_monport }},server=on,wait=off
              -mon chardev=mon0
              -boot order=c
              -drive file="{{ imagebuilder_build_iso }}",media=cdrom,index=1
        - name: "Buildimage | Wait for QEMU monitor"
          ansible.builtin.include_tasks:
            file: qemu/wait_monitor.yml
        - name: "Buildimage | Wait for QEMU VM to be accessible"
          ansible.builtin.wait_for:
            host: "{{ imagebuilder_localip }}"
            port: "{{ (os_type | lower == 'linux') | ternary(imagebuilder_env_qemu_ssh_port, imagebuilder_env_qemu_psrp_port) }}"
            delay: 10
            timeout: 900
        - name: "Buildimage | Wait for SSH/PSRP to be ready on QEMU VM"
          ansible.builtin.include_tasks: waitfor.yml
          vars:
            wait_host_ip: "{{ imagebuilder_config.builder.qemu.host }}"
            wait_port: "{{ (os_type | lower == 'linux') | ternary(imagebuilder_env_qemu_ssh_port, imagebuilder_env_qemu_psrp_port) }}"
            wait_proto: "{{ (os_type | lower == 'windows') | ternary('psrp', 'ssh') }}"
            ponder: true
          tags:
            - build_customise
