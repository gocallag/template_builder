---
- name: Main | setup to get facts for the build system
  ansible.builtin.setup:

- name: Main | Load imagebuilder configuration
  ansible.builtin.include_vars:
    file: "{{ imagebuilder_config_path }}"
    name: imagebuilder_config
  no_log: true

- name: Main | Assert core build variables
  ansible.builtin.assert:
    that:
      - imagebuilder_phase in ['build', 'base', 'patch', 'download', 'clean']
      - os is defined
      - os.plugin is defined
      - os.iso is defined
      - os.iso | trim | length > 0
      - imagebuilder_config.builder is defined
      - imagebuilder_config.builder.build_path is defined
      - imagebuilder_config.builder.qemu.host is defined
      - imagebuilder_config.builder.build_path | trim | length > 0
      - imagebuilder_config.builder.qemu.host | trim | length > 0
      - imagebuilder_id_prefix in imagebuilder_prefix_port_offset_map

- name: Main | Cleanup | Remove any existing build artifacts
  when: imagebuilder_phase in ['clean']
  block:
    - name: Main | Cleanup | Remove any existing build artifacts
      ansible.builtin.include_tasks: cleanup.yml
    - meta: end_play

- name: Main | Initialise the plugin for the OS
  ansible.builtin.include_role:
    name: "{{ os.plugin }}"
    tasks_from: plugin.yml

- name: Main | Get the OS-specific profile
  ansible.builtin.include_role:
    name: "{{ os.plugin }}"
    tasks_from: buildprofile.yml

- name: Main | Get the system ready for the build
  ansible.builtin.include_tasks: setup.yml

- name: Main | Orchestration | Execute the Download
  when: imagebuilder_phase in ['base','download']
  block:
    - name: Main | OS-specific downloads
      when: imagebuilder_plugin.download | default(false) | bool
      ansible.builtin.include_role:
        name: "{{ os.plugin }}"
        tasks_from: download.yml

    - name: Main | use inbuilt download role if OS plugin does not have a download task
      ansible.builtin.include_tasks: download.yml
      when: imagebuilder_plugin.download | default(false) | bool is not true

    - meta: end_play
      when: imagebuilder_phase in ['download']

- name: Main | Orchestration | Execute the build phase
  when: imagebuilder_phase in ['build', 'base', 'patch']
  block:

    - name: Main | Validate patch source selection
      ansible.builtin.assert:
        that:
          - imagebuilder_patch_from in ['latest', 'base']
        fail_msg: "imagebuilder_patch_from must be 'latest' or 'base'"
      when: imagebuilder_phase == 'patch'

    - name: Main | Resolve patch source artifact
      ansible.builtin.include_tasks:
        file: resolve_artifact.yml
      when: imagebuilder_phase == 'patch'

    - name: Main | Require a patch source artifact
      ansible.builtin.assert:
        that:
          - imagebuilder_resolved_artifact.exists | default(false)
        fail_msg: >-
          No patch source artifact found for '{{ imagebuilder_patch_from }}'.
          Create a base artifact first with 'ib phase base <image>'.
      when: imagebuilder_phase == 'patch'

    - name: Main | Restore resolved artifact
      ansible.builtin.include_tasks:
        file: restore_artifact.yml
      vars:
        imagebuilder_restore_artifact: "{{ imagebuilder_resolved_artifact }}"
      when:
        - imagebuilder_phase == 'patch'
        - imagebuilder_resolved_artifact.exists | default(false)

    - name: Main | Create base artifact
      ansible.builtin.include_tasks: phase-base.yml
      vars:
        imagebuilder_pipeline_phase: base
      when: imagebuilder_phase == 'base'

    - name: Main | Patch selected artifact
      ansible.builtin.include_tasks: phase-patch.yml
      vars:
        imagebuilder_pipeline_phase: patch
      when: imagebuilder_phase == 'patch'

    - name: Main | Execute end-to-end build
      ansible.builtin.include_tasks: phase-build.yml
      when: imagebuilder_phase == 'build'

  rescue:

    - name: "Main | Show error on failure"
      ansible.builtin.debug:
        msg: >-
          Main | Task '{{ ansible_failed_task.name }}' failed.
          {{ ansible_failed_result.msg | default('no additional message') }}

    - name: Main | Fail orchestration after diagnostics
      ansible.builtin.fail:
        msg: >-
          Image build orchestration failed at task
          '{{ ansible_failed_task.name }}'.

  always:

    - name: Main | Display Webserver job_id
      ansible.builtin.debug:
        msg: "Main | Webserver jobid is {{ webserver.ansible_job_id }} "
      when: webserver is defined and webserver.ansible_job_id is defined

    - name: Main | kill dangly web servers
      ansible.builtin.shell: |
        kill {{ webserver.ansible_job_pid | default('') }} 2>/dev/null || true
        sleep 5
        kill -9 {{ webserver.ansible_job_pid | default('') }} 2>/dev/null || true
      when: webserver is defined and webserver.ansible_job_pid is defined
      changed_when: false
