---
- name: Main | setup to get facts for the build system
  ansible.builtin.setup:

- name: Main | Load imagebuilder configuration
  ansible.builtin.include_vars:
    file: "{{ imagebuilder_config_path }}"
    name: imagebuilder_config
  no_log: true

- name: Main | Assert core build variables
  ansible.builtin.assert:
    that:
      - os is defined
      - os.plugin is defined
      - os.iso is defined
      - os.iso | trim | length > 0
      - imagebuilder_config.builder is defined
      - imagebuilder_config.builder.build_path is defined
      - imagebuilder_config.builder.qemu.host is defined
      - imagebuilder_config.builder.build_path | trim | length > 0
      - imagebuilder_config.builder.qemu.host | trim | length > 0

- name: Main | Get the system ready for the build
  ansible.builtin.include_tasks: setup.yml

- name: Main | add default build steps if none are defined defined by the build task
  ansible.builtin.set_fact:
    imagebuilder_build: "{{ build | default(imagebuilder_build_default) }}"

- name: Main | Validate OS plugin
  ansible.builtin.include_role:
    name: "{{ os.plugin }}"
    tasks_from: asserts.yml

- name: Main | Cleanup | Remove any existing build artifacts
  when: imagebuilder_phase == 'clean'
  block:
    - name: Main | Cleanup | Remove any existing build artifacts
      ansible.builtin.include_tasks: cleanup.yml

- name: Main | Build Phase
  when: imagebuilder_phase == 'build'
  block:
    - name: Main | Build OS-specific profile
      ansible.builtin.include_role:
        name: "{{ os.plugin }}"
        tasks_from: buildprofile.yml

    - name: Main | Restore Image(s) if they exist
      ansible.builtin.include_tasks: restore.yml

    - name: Main | OS-specific downloads
      ansible.builtin.include_role:
        name: "{{ os.plugin }}"
        tasks_from: download.yml
    - name: Main | use inbuilt download role if OS plugin does not have a download task
      ansible.builtin.include_tasks: download.yml
      when: imagebuilder_download_result is false

    - name: Main | Perform the defined build
      when: not imagebuilder_restored_from_custom_image | default(false)
      block:
        - name: (MAIN) include build roles if any are defined
          ansible.builtin.include_role:
            name: imagebuilder
            tasks_from: "glue/glue.yml"
          vars:
            imagebuilder_stage: "{{ imagebuilder_buildtask.name }}"
            imagebuilder_task_vars: "{{ imagebuilder_buildtask.task_vars | default({}) }}"
          loop: "{{ imagebuilder_build | default([]) }}"
          loop_control:
            loop_var: imagebuilder_buildtask
        - name: (QEMU) Wait for custom image release
          ansible.builtin.include_tasks:
            file: qemu/wait_image_release.yml
          vars:
            imagebuilder_qemu_image_path: "{{ imagebuilder_path_imagedir }}/{{ imagebuilder_id_base }}.x86_64.qcow2"

        - name: Main | save custom image
          block:
            - name: Main | convert custom image with free block cleanup
              ansible.builtin.command: qemu-img convert -f qcow2 -O qcow2 "{{ imagebuilder_path_imagedir }}/{{ imagebuilder_id_base }}.x86_64.qcow2" "{{ imagebuilder_path_savedir }}/{{ imagebuilder_id_base }}.custom.{{ imagebuilder_profile_hash }}.qcow2.tmp"
              changed_when: true

            - name: Main | finalize custom image
              ansible.builtin.command: mv "{{ imagebuilder_path_savedir }}/{{ imagebuilder_id_base }}.custom.{{ imagebuilder_profile_hash }}.qcow2.tmp" "{{ imagebuilder_path_savedir }}/{{ imagebuilder_id_base }}.custom.{{ imagebuilder_profile_hash }}.qcow2"
              changed_when: true

            - name: Main | write custom artifact metadata
              ansible.builtin.copy:
                dest: "{{ imagebuilder_path_savedir }}/{{ imagebuilder_id_base }}.custom.{{ imagebuilder_profile_hash }}.qcow2.meta.yml"
                mode: "0644"
                content: |
                  profile_hash: "{{ imagebuilder_profile_hash }}"
                  id: "{{ imagebuilder_id_base }}"
                  created_at: "{{ ansible_date_time.iso8601 }}"
                  stage: custom
                  ttl_days: 7

  rescue:

    - name: "Main | Show error on failure"
      ansible.builtin.debug:
        msg: >-
          Main | Task '{{ ansible_failed_task.name }}' failed.
          {{ ansible_failed_result.msg | default('no additional message') }}

  always:

    - name: Main | Display Webserver job_id
      ansible.builtin.debug:
        msg: "Main | Webserver jobid is {{ webserver.ansible_job_id }} "
      when: webserver is defined and webserver.ansible_job_id is defined

    - name: Main | kill dangly web servers
      ansible.builtin.shell: |
        kill {{ webserver.ansible_job_pid | default('') }} 2>/dev/null || true
        sleep 5
        kill -9 {{ webserver.ansible_job_pid | default('') }} 2>/dev/null || true
      when: webserver is defined and webserver.ansible_job_pid is defined
      changed_when: false

- name: Main | Publish Artifact
  when: imagebuilder_phase == 'publish' or imagebuilder_phase == 'build'
  block:

    - name: Main | Define canonical artifact
      ansible.builtin.set_fact:
        imagebuilder_artifact:
          id: "{{ imagebuilder_id_base }}"
          path: "{{ imagebuilder_path_savedir }}/{{ imagebuilder_id_base }}.custom.{{ imagebuilder_profile_hash }}.qcow2"
          format: qcow2
          architecture: "{{ os.architecture }}"

    - name: Main | Execute target plugins
      ansible.builtin.include_role:
        name: "{{ imagebuilder_target.plugin }}"
      loop: "{{ imagebuilder_targets | default([]) }}"
      loop_control:
        loop_var: imagebuilder_target
