---
- name: Main | waitfor | Wait for connection
  ansible.builtin.wait_for_connection:
    connect_timeout: 10
    sleep: 5
    timeout: 1200
  delegate_to: bob_build

- name: Main | waitfor | setup after connection
  ansible.builtin.setup:
    gather_subset:
      - 'min'
  delegate_to: bob_build

- name: Main | waitfor | Linux readiness checks
  when:
    - ansible_os_family | lower != 'windows'
  block:
    - name: Main | waitfor | Wait for package manager locks
      ansible.builtin.shell: >
        fuser
        {{ imagebuilder_package_lock_files.get(ansible_os_family, []) | join(' ') }}
        2>/dev/null
      register: package_locks
      changed_when: false
      failed_when: false
      retries: 120
      delay: 5
      until: package_locks.rc != 0
      delegate_to: bob_build
      when:
        - ansible_os_family in imagebuilder_package_lock_files

- name: Main | waitfor | Windows readiness checks
  when:
    - ansible_os_family | lower == 'windows'
  block:
    - name: Main | waitfor | Windows Ponder
      ansible.windows.win_shell: |
        function ExitWithCode($exitCode) {
            $host.SetShouldExit($exitCode)
            Exit
        }
        Add-Type @'
          using System;
          using System.Runtime.InteropServices;

          public static class Windows
          {
              [DllImport("kernel32", SetLastError=true)]
              public static extern UInt64 GetTickCount64();

              public static TimeSpan GetUptime()
              {
                  return TimeSpan.FromMilliseconds(GetTickCount64());
              }
          }
        '@

        function Wait-Condition {
            param(
              [scriptblock]$Condition,
              [int]$DebounceSeconds=15
            )
            process {
                $begin = [Windows]::GetUptime()
                do {
                    Start-Sleep -Seconds 1
                    try {
                      $result = &$Condition
                    } catch {
                      $result = $false
                    }
                    if (-not $result) {
                        $begin = [Windows]::GetUptime()
                        continue
                    }
                } while ((([Windows]::GetUptime()) - $begin).TotalSeconds -lt $DebounceSeconds)
            }
        }
        Write-Output 'Waiting for the Windows Modules Installer to exit...'
        Wait-Condition {(Get-Process -ErrorAction SilentlyContinue TiWorker | Measure-Object).Count -eq 0}
        ExitWithCode 0
      delegate_to: bob_build
