- name: Base | delete any existing (in-progress) QEMU VM disk image
  ansible.builtin.file:
    path: "{{ qemufile }}"
    state: absent
  loop_control:
    loop_var: qemufile
  loop:
    - "{{ imagebuilder_path_imagedir }}/{{ imagebuilder_id_base }}.x86_64.qcow2"
- name: Base | Create VM disk image
  ansible.builtin.command: qemu-img create -f qcow2 "{{ imagebuilder_path_imagedir }}/{{ imagebuilder_id_base }}.x86_64.qcow2" "{{ os.config.disks[0] }}G"
  args:
      creates: "{{ imagebuilder_path_imagedir }}/{{ imagebuilder_id_base }}.x86_64.qcow2"
  register: imagebuilder_qemu_disk
  failed_when: imagebuilder_qemu_disk.rc != 0
  changed_when: imagebuilder_qemu_disk.rc == 0

- name: Base | call the OS specific BUILDAUX
  ansible.builtin.include_tasks:
    file: buildaux.yml
- name: Main | build the base image
  ansible.builtin.include_tasks:
    file: buildimage.yml