---
- name: Proxmox | Initialise target lifecycle state
  ansible.builtin.set_fact:
    imagebuilder_target_pipeline_complete: false
    imagebuilder_target_runtime_stopped: false

- name: Proxmox | Execute target pipeline
  block:
    - name: Proxmox | Prepare, uplift, harden, clean, and publish
      ansible.builtin.include_tasks: pipeline.yml

    - name: Proxmox | Mark target pipeline complete
      ansible.builtin.set_fact:
        imagebuilder_target_pipeline_complete: true

  rescue:
    - name: Proxmox | Report target pipeline failure
      ansible.builtin.debug:
        msg: >-
          Proxmox target failed at '{{ ansible_failed_task.name }}':
          {{ ansible_failed_result.msg | default('no additional message') }}

    - name: Proxmox | Re-raise target pipeline failure
      ansible.builtin.fail:
        msg: "Proxmox target failed at '{{ ansible_failed_task.name }}'."

  always:
    - name: Proxmox | Recover QEMU job state for cleanup
      ansible.builtin.set_fact:
        imagebuilder_cap_qemu_job: "{{ imagebuilder_qemu_job }}"
      when:
        - not imagebuilder_target_pipeline_complete
        - imagebuilder_cap_qemu_job is not defined
        - imagebuilder_qemu_job is defined

    - name: Proxmox | Stop guest after target failure
      ansible.builtin.include_role:
        name: gocallag.template_builder.imagebuilder
        tasks_from: capabilities/qemu_shutdown
      vars:
        imagebuilder_capability_artifact:
          path: "{{ imagebuilder_target_artifact.path }}"
      when:
        - not imagebuilder_target_pipeline_complete
        - not imagebuilder_target_runtime_stopped
        - imagebuilder_cap_qemu_job is defined
        - imagebuilder_target_artifact.path is defined

    - name: Proxmox | Remove remote import file
      ansible.builtin.file:
        path: "{{ imagebuilder_proxmox_remote_image }}"
        state: absent
      delegate_to: imagebuilder_proxmox_server
      become: true
      when:
        - imagebuilder_proxmox_remote_image is defined

    - name: Proxmox | Remove local target working image
      ansible.builtin.file:
        path: "{{ imagebuilder_proxmox_working_image }}"
        state: absent
      when:
        - imagebuilder_proxmox_working_image is defined

    - name: Proxmox | Remove local converted image
      ansible.builtin.file:
        path: "{{ imagebuilder_proxmox_output }}"
        state: absent
      when:
        - imagebuilder_proxmox_output is defined
