# RedHat-Based Systems
- name: (BUILDAUX, CentOS)
  tags:
      - build_aux
  block:
      # - name: (BUILDAUX, redhat) create build directories
      #   ansible.builtin.file:
      #       path: "{{ file }}"
      #       state: directory
      #       mode: "0755"
      #   loop_control:
      #       loop_var: file
      #   loop:
      #       - "{{ imagebuilder_config.builder.build_path }}/{{ imagebuilder_id_base }}/{{ imagebuilder_build_mntdir }}"
      #       - "{{ imagebuilder_config.builder.build_path }}/{{ imagebuilder_id_base }}/{{ imagebuilder_build_mntdir }}/mnt"
      - name: (BUILDAUX, CentOS) remove existing aux ISO (if it exists)
        ansible.builtin.file:
            path: "{{ imagebuilder_path_auxdir }}/aux.iso"
            state: absent

      # - name: (BUILDAUX, CentOS) create temporary iso contents dir
      #   ansible.builtin.file:
      #       path: "{{ imagebuilder_config.builder.build_path }}/{{ imagebuilder_id_base }}/{{ imagebuilder_build_imagedir }}/iso_contents"
      #       state: directory
      #       mode: "0755"

      - name: (BUILDAUX, CentOS) use default ks if none provided
        ansible.builtin.include_tasks:
            file: buildprofile.yml

      - name: (BUILDAUX, CentOS) Copy kickstart file (CentOS) to ISO contents
        ansible.builtin.copy:
            content: "{{ ks }}"
            dest: "{{ imagebuilder_path_mntdir }}/ks.cfg"
            mode: "0644"
        become: true
      - name: (BUILDAUX, CentOS) Copy kickstart file (CentOS) to http directory
        ansible.builtin.copy:
            content: "{{ ks }}"
            dest: "{{ imagebuilder_path_httpdir }}/ks.cfg"
            mode: "0644"
        become: true

      - name: (BUILDAUX, CentOS) Build aux ISO from contents (label OEMDRV)
        ansible.builtin.command: >
          genisoimage -output aux.iso -volid OEMDRV -joliet -rock .
        args:
            chdir: "{{ imagebuilder_path_mntdir }}"
            creates: "{{ imagebuilder_path_auxdir }}/aux.iso"
        register: mkiso # noqa: var-naming
        failed_when: mkiso.rc != 0

      # - name: (BUILDAUX, CentOS) Move aux ISO to build directory
