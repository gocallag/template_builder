---
- name: (Debian) Validate OS configuration
  ansible.builtin.assert:
    that:
      - os is defined
      - os.family | lower == "linux"
      - os.variant | default("debian") | lower == "debian"
      - os.version is defined
      - os.version | string | length > 0
      - os.architecture is defined
      - os.architecture | length > 0
      - os.iso is defined
      - os.iso | length > 0
      - os.checksum is defined
      - os.checksum | length > 0
    fail_msg: "(Debian) Invalid Fedora configuration"
