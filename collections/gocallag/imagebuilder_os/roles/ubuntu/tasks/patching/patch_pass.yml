---
- name: Patching | patch_pass| Increment patch pass counter
  ansible.builtin.set_fact:
    imagebuilder_ubuntu_patch_pass: >-
      {{ (imagebuilder_ubuntu_patch_pass | default(0) | int) + 1 }}

- name: Patching | patch_pass | Check whether reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_check
  changed_when: false
  failed_when: false
  delegate_to: bob_build

- name: Patching | patch_pass | Reboot if required
  ansible.builtin.reboot:
    reboot_timeout: 1200
  when:
    - reboot_check.stat.exists | default(false)
  become: true
  delegate_to: bob_build

- name: Patching | patch_pass | Wait for connection after reboot
  ansible.builtin.wait_for_connection:
    connect_timeout: 10
    sleep: 10
    timeout: 1200
  delegate_to: bob_build


- name: Patching | patch_pass | Wait for guest to settle after bootstrap reboot
  ansible.builtin.include_tasks:
    file: wait_settled.yml
  when:
    - reboot_check.stat.exists | default(false)

#
# Normal Ansible suse Update pass.
#

- name: Patching | patch_pass | Configure pending packages
  command: "dpkg --configure -a"
  become: true
  delegate_to: bob_build

- name: Patching | patch_pass | Update the system
  apt:
    name: "*"
    state: latest
    update_cache: yes
  become: true
  register: imagebuilder_apt
  delegate_to: bob_build


- name: Patching | patch_pass | Debug apt output
  ansible.builtin.debug:
      msg: >-
          (PATCHING) Task '{{ imagebuilder_apt }}'.

- name: Patching | patch_pass | Check whether reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_check
  changed_when: false
  failed_when: false
  delegate_to: bob_build

- name: Patching | patch_pass | Reboot if required
  ansible.builtin.reboot:
    reboot_timeout: 1200
  when:
    - reboot_check.stat.exists | default(false)
  become: true
  delegate_to: bob_build

- name: Patching | patch_pass | Wait for guest to settle after update reboot
  ansible.builtin.include_tasks:
    file: wait_settled.yml
  when:
    - reboot_check.stat.exists | default(false)


#
# Convergence test.
#
# There is intentionally no pre-install search. state=installed already
# searches for applicable updates. This search exists only to determine
# whether another patch pass is required.
#

- name: Patching | patch_pass | Refresh repositories
  ansible.builtin.apt:
    update_cache: true
  become: true
  delegate_to: bob_build
  changed_when: false

- name: Patching | patch_pass | Check for available updates
  ansible.builtin.command:
    argv:
      - apt-get
      - -s
      - dist-upgrade
  become: true
  delegate_to: bob_build
  register: imagebuilder_apt_updates
  changed_when: false

- name: Patching | patch_pass | Set update availability
  ansible.builtin.set_fact:
    imagebuilder_apt_updates_available: >-
      {{
        imagebuilder_apt_updates.stdout is search('^Inst ')
      }}

- name: Patching | patch_pass | Continue patching
  ansible.builtin.include_tasks:
    file: patch_pass.yml
  when:
    - imagebuilder_apt_updates_available

