---
- name: Wait_settled | Wait for guest port to be available
  ansible.builtin.wait_for:
    host: "{{ imagebuilder_localip }}"
    port: "{{ (os_type | lower == 'linux') | ternary(imagebuilder_env_qemu_ssh_port, imagebuilder_env_qemu_psrp_port) }}"
    delay: 10
    timeout: 900
  delegate_to: localhost

- name: Wait_settled | Wait for connection
  ansible.builtin.wait_for_connection:
    connect_timeout: 10
    sleep: 10
    timeout: 1200
  delegate_to: bob_build

- name: Wait_settled | Verify Ansible connection after settling
  ansible.builtin.setup:
  changed_when: false
  delegate_to: bob_build
