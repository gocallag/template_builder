---
- name: (Windows-UPLIFT) Validate inputs
  ansible.builtin.assert:
    that:
      - imagebuilder_uplift_artifact is defined
      - imagebuilder_uplift_artifact.path is defined
      - imagebuilder_target_features is defined

- name: (Windows-UPLIFT) Validate features
  ansible.builtin.assert:
    that:
      - item in
        [
          'qemu_guest_agent'
        ]
    fail_msg: >-
      Unsupported Windows uplift feature '{{ item }}'
  loop: "{{ imagebuilder_target_features }}"

- name: (Windows-UPLIFT) Boot target image
  ansible.builtin.include_role:
    name: gocallag.template_builder.imagebuilder
    tasks_from: capabilities/qemu_boot_existing
  vars:
    imagebuilder_capability_artifact:
      path: "{{ imagebuilder_uplift_artifact.path }}"

- name: (Windows-UPLIFT) Configure guest
  block:

    - name: (Windows-UPLIFT) Wait for guest
      ansible.builtin.include_role:
        name: gocallag.template_builder.imagebuilder
        tasks_from: capabilities/wait_guest

    - name: (Windows-UPLIFT) Apply feature
      ansible.builtin.include_tasks:
        file: "features/{{ item }}.yml"
      loop: "{{ imagebuilder_target_features }}"

    - name: (Windows-UPLIFT) Wait for Windows servicing to settle
      ansible.builtin.include_role:
        name: gocallag.template_builder.imagebuilder
        tasks_from: capabilities/wait_settled

  always:

    - name: (Windows-UPLIFT) Shutdown target image
      ansible.builtin.include_role:
        name: gocallag.template_builder.imagebuilder
        tasks_from: capabilities/qemu_shutdown
      vars:
        imagebuilder_capability_artifact:
          path: "{{ imagebuilder_uplift_artifact.path }}"