---
- name: Windows | Remove temporary WSUS configuration
  when:
    - wsus_location is defined
    - wsus_location != "internet"
  block:
    - name: Windows | Stop Windows Update service
      ansible.windows.win_service:
        name: wuauserv
        state: stopped
      delegate_to: bob_build

    - name: Windows | Remove WSUS server values
      ansible.windows.win_regedit:
        path: HKLM:\Software\Policies\Microsoft\Windows\WindowsUpdate
        name: "{{ item }}"
        state: absent
      loop:
        - WUServer
        - WUStatusServer
      delegate_to: bob_build

    - name: Windows | Disable WSUS
      ansible.windows.win_regedit:
        path: HKLM:\Software\Policies\Microsoft\Windows\WindowsUpdate\AU
        name: UseWUServer
        data: 0
        type: dword
        state: present
      delegate_to: bob_build

    - name: Windows | Start Windows Update service
      ansible.windows.win_service:
        name: wuauserv
        state: started
      delegate_to: bob_build
- name: Windows | Remove temporary update script
  ansible.windows.win_file:
    path: C:\Windows\Temp\windows-update.ps1
    state: absent
  delegate_to: bob_build