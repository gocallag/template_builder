---
- name: Windows | Ensure patch workspace exists
  ansible.windows.win_file:
    path: C:\Windows\Temp
    state: directory

- name: Windows | Copy Windows Update script
  ansible.windows.win_copy:
    src: windows-update.ps1
    dest: C:\Windows\Temp\windows-update.ps1

- name: Windows | Configure WSUS
  when:
    - wsus_location is defined
    - wsus_location != "internet"
  block:
    - name: Windows | Reset WinHTTP proxy
      ansible.windows.win_command:
        cmd: netsh winhttp reset proxy
      register: imagebuilder_windows_proxy_reset
      failed_when: false
      changed_when: imagebuilder_windows_proxy_reset.rc == 0

    - name: Windows | Stop Windows Update service
      ansible.windows.win_service:
        name: wuauserv
        state: stopped

    - name: Windows | Configure WSUS servers
      ansible.windows.win_regedit:
        path: HKLM:\Software\Policies\Microsoft\Windows\WindowsUpdate
        name: "{{ item }}"
        data: "http://{{ wsus_location }}:8530"
        type: string
        state: present
      loop:
        - WUServer
        - WUStatusServer

    - name: Windows | Configure automatic update options
      ansible.windows.win_regedit:
        path: HKLM:\Software\Policies\Microsoft\Windows\WindowsUpdate\AU
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: dword
        state: present
      loop:
        - name: AUOptions
          data: 3
        - name: NoAutoUpdate
          data: 0
        - name: UseWUServer
          data: 1

    - name: Windows | Start Windows Update service
      ansible.windows.win_service:
        name: wuauserv
        state: started

    - name: Windows | Trigger WSUS detection
      ansible.windows.win_command:
        cmd: wuauclt.exe /resetauthorization /detectnow
      register: imagebuilder_windows_wsus_registration
      failed_when: false
      changed_when: true
