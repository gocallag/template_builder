---
- name: Windows | Initialise patch state
  ansible.builtin.set_fact:
    imagebuilder_windows_patch_pass: 0

- name: Windows | Open controlled Windows Update patch window
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
    name: DoNotConnectToWindowsUpdateInternetLocations
    state: absent
  delegate_to: bob_build
  become: true
  become_user: SYSTEM
  become_method: ansible.builtin.runas
  
- name: Windows | Converge Windows updates
  ansible.builtin.include_tasks:
    file: patch_pass.yml
