---
- name: Target-uplift | Validate inputs
  ansible.builtin.assert:
    that:
      - imagebuilder_uplift_artifact is defined
      - imagebuilder_uplift_artifact.path is defined
      - imagebuilder_target_features is defined

- name: Target-uplift | Validate features
  ansible.builtin.assert:
    that:
      - item in ['qemu_guest_agent']
    fail_msg: >-
      Unsupported RHEL uplift feature '{{ item }}'
  loop: "{{ imagebuilder_target_features }}"

- name: Target-uplift | Boot target image
  ansible.builtin.include_role:
    name: gocallag.template_builder.imagebuilder
    tasks_from: capabilities/qemu_boot_existing
  vars:
    imagebuilder_capability_artifact:
      path: "{{ imagebuilder_uplift_artifact.path }}"

- name: Target-uplift | Configure guest
  block:

    - name: Target-uplift | Wait for guest
      ansible.builtin.include_role:
        name: gocallag.template_builder.imagebuilder
        tasks_from: capabilities/wait_guest

    - name: Target-uplift | Register RHSM and configure guest
      block:
        - name: Target-uplift | Configure RHSM
          ansible.builtin.include_role:
            name: gocallag.imagebuilder_os.rhel
            tasks_from: patching/prepare.yml

        - name: Target-uplift | Install QEMU guest agent
          ansible.builtin.include_role:
            name: gocallag.template_builder.imagebuilder
            tasks_from: capabilities/guest_command
          vars:
            imagebuilder_guest_command: >-
              sudo dnf install -y qemu-guest-agent &&
              sudo systemctl enable qemu-guest-agent
          when:
            - "'qemu_guest_agent' in imagebuilder_target_features"

      always:
        - name: Target-uplift | Unregister RHSM and clean up
          ansible.builtin.include_role:
            name: gocallag.imagebuilder_os.rhel
            tasks_from: patching/cleanup.yml

  always:

    - name: Target-uplift | Shutdown target image
      ansible.builtin.include_role:
        name: gocallag.template_builder.imagebuilder
        tasks_from: capabilities/qemu_shutdown
      vars:
        imagebuilder_capability_artifact:
          path: "{{ imagebuilder_uplift_artifact.path }}"
