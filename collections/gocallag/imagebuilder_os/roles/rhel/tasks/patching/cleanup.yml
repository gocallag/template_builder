---
- name: Patching | cleanup | Clean dnf cache and unregister
  block:
    - name: Patching | cleanup | Clean dnf cache
      ansible.builtin.command: dnf clean all
      register: imagebuilder_dnf_clean
      failed_when: imagebuilder_dnf_clean.rc != 0
      changed_when: false
      become: true
      delegate_to: bob_build
      when: imagebuilder_rhel_rhsm_registration_attempted | default(false)

  always:
    - name: Patching | cleanup | Unregister from RHSM
      community.general.redhat_subscription:
        state: absent
      become: true
      delegate_to: bob_build
      when: imagebuilder_rhel_rhsm_registration_attempted | default(false)
